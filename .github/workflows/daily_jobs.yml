name: Daily Job Digest Email

on:
  schedule:
    - cron: '0 1 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-job-digest-email
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate workbook and send digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python job_digest.py --send-email
      - name: Archive Excel workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-digest-${{ github.run_number }}
          path: out/job_digest.xlsx
          if-no-files-found: error
          retention-days: 14
